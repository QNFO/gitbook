name: Sync Publications to GitBook

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  repository_dispatch:
    types: [publications-updated]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout .github repo (publications source)
        uses: actions/checkout@v4
        with:
          repository: QNFO/.github
          path: source
          ref: master

      - name: Checkout GitBook repo (target)
        uses: actions/checkout@v4
        with:
          path: gitbook

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync publications
        shell: python
        run: |
          import os, re, shutil
          from pathlib import Path
          from collections import defaultdict

          SOURCE = Path("source/publications")
          TARGET = Path("gitbook/releases")

          if not SOURCE.exists():
              print("Source directory not found: " + str(SOURCE))
              exit(1)

          TARGET.mkdir(parents=True, exist_ok=True)

          publications = defaultdict(list)
          for md_file in sorted(SOURCE.rglob("*.md")):
              if md_file.name.startswith("_"):
                  continue
              rel = md_file.relative_to(SOURCE)
              parts = rel.parts
              year = parts[0] if len(parts) > 0 else "unknown"
              publications[year].append(md_file)

          copied = 0
          for year, files in sorted(publications.items()):
              for src in files:
                  rel = src.relative_to(SOURCE)
                  dst = TARGET / rel
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
                  copied += 1

          print("Copied " + str(copied) + " publication files")

          by_month = defaultdict(list)
          for year in sorted(publications.keys(), reverse=True):
              for f in sorted(publications[year]):
                  rel = f.relative_to(SOURCE)
                  parts = rel.parts
                  month = parts[1] if len(parts) > 1 else "00"
                  by_month[month].append(f)

          summary_lines = ["# Table of Contents", "", "* [Home](README.md)", "* [About QNFO](ABOUT.md)", "* [License](LICENSE.md)", "", "## Research Publications", ""]
          for year in sorted(publications.keys(), reverse=True):
              summary_lines.append("### " + year + " (" + str(len(publications[year])) + " papers)")
              summary_lines.append("")
              year_months = sorted(set(p[0] for p in [f.relative_to(SOURCE).parts for f in sorted(publications[year])]))
              for month in sorted(year_months):
                  month_files = sorted([f for f in publications[year] if f.relative_to(SOURCE).parts[1] == month])
                  summary_lines.append("* **" + year + "-" + month + "**")
                  for f in month_files:
                      rel = str(f.relative_to(SOURCE)).replace("\\", "/")
                      title = f.stem[:80]
                      summary_lines.append("  * [" + title + "](releases/" + rel + ")")
                  summary_lines.append("")

          with open("gitbook/SUMMARY.md", "w", encoding="utf-8") as sf:
              sf.write("\n".join(summary_lines))
          print("Generated SUMMARY.md")

      - name: Check for changes
        id: check
        run: |
          cd gitbook
          if [ -n "?? _temp/" ]; then
            echo "changed=true" >> 
          else
            echo "changed=false" >> 
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          cd gitbook
          git config user.name "QNFO GitBook Bot"
          git config user.email "gitbook-bot@qnfo.org"
          git add releases/ SUMMARY.md
          git commit -m "sync: auto-update publications 

          Automated sync from QNFO/.github/publications/
          Triggered by: ${{ github.event_name }}"
          git push origin main