name: Sync Publications to GitBook

permissions:
  contents: write

# One run at a time: the job pushes to main.
concurrency:
  group: sync-publications
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  repository_dispatch:
    types: [publications-updated]

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout publications source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: QNFO/.github
          path: source
          ref: master

      - name: Checkout GitBook repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitbook

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Sync publications
        shell: python
        run: |
          import os, shutil, re
          from pathlib import Path
          from collections import defaultdict

          SOURCE = Path("source/publications")
          TARGET = Path("gitbook/releases")

          if not SOURCE.exists():
              print("ERROR: Source directory not found — skipping sync")
              exit(0)

          TARGET.mkdir(parents=True, exist_ok=True)

          # Remove stale files first (clean sync)
          existing = set()
          for f in TARGET.rglob("*.md"):
              existing.add(f.relative_to(TARGET))
          
          copied = 0
          new_files = set()
          for md_file in sorted(SOURCE.rglob("*.md")):
              if md_file.name.startswith("_"):
                  continue
              rel = md_file.relative_to(SOURCE)
              dst = TARGET / rel
              new_files.add(rel)
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(md_file, dst)
              copied += 1
          
          # Remove files that no longer exist in source
          removed = 0
          for old_rel in existing - new_files:
              old_file = TARGET / old_rel
              if old_file.exists():
                  old_file.unlink()
                  removed += 1
          
          print(f"Copied {copied}, removed {removed} stale files")

          # Generate SUMMARY.md
          years = sorted(set(p.parts[0] for p in [f.relative_to(SOURCE) for f in SOURCE.rglob("*.md") if not f.name.startswith("_")]))
          lines = ["# Table of Contents", "", "* [Home](README.md)", "* [About QNFO](ABOUT.md)", "* [License](LICENSE.md)", "", "## Research Publications", ""]

          for year in sorted(years, reverse=True):
              year_files = sorted(SOURCE.rglob(f"{year}/**/*.md"))
              year_files = [f for f in year_files if not f.name.startswith("_")]
              if not year_files:
                  continue
              lines.append(f"### {year} ({len(year_files)} papers)")
              lines.append("")
              months = sorted(set(f.relative_to(SOURCE).parts[1] for f in year_files if len(f.relative_to(SOURCE).parts) >= 2))
              for month in months:
                  month_files = sorted([f for f in year_files if f.relative_to(SOURCE).parts[1] == month])
                  lines.append(f"* **{year}-{month}**")
                  for f in month_files:
                      rel = str(f.relative_to(SOURCE)).replace("\\", "/")
                      name = f.stem[:80]
                      lines.append(f"  * [{name}](releases/{rel})")
                  lines.append("")

          summary_path = Path("gitbook/SUMMARY.md")
          summary_path.write_text("\n".join(lines), encoding="utf-8")
          print(f"Generated SUMMARY.md ({summary_path.stat().st_size} bytes)")

      - name: Check for changes
        id: check
        run: |
          cd gitbook
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push (with retry)
        if: steps.check.outputs.changed == 'true'
        run: |
          cd gitbook
          git config user.name "QNFO GitBook Bot"
          git config user.email "gitbook-bot@qnfo.org"
          git add releases/ SUMMARY.md
          git commit -m "sync: auto-update publications $(date +%Y-%m-%d)"
          
          # Retry push up to 3 times (network blips)
          for i in 1 2 3; do
            echo "Push attempt $i/3..."
            if git push origin main 2>&1; then
              echo "Push succeeded"
              exit 0
            fi
            if [ $i -eq 3 ]; then
              echo "FATAL: Push failed after 3 attempts"
              exit 1
            fi
            echo "Push failed, retrying in 15s..."
            sleep 15
          done